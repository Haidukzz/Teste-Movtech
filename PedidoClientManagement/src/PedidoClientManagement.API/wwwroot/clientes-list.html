<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gerenciar Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <a href="index.html" class="btn btn-secondary mb-4">← Voltar ao Início</a>
    <h1>Clientes Cadastrados</h1>
    <div id="alertPlaceholder"></div>
    <div class="table-responsive">
      <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark">
          <tr>
            <th>Id</th><th>Nome</th><th>Email</th><th>Data Nasc.</th><th>CPF</th><th>Endereço</th><th>Ações</th>
          </tr>
        </thead>
        <tbody id="clientesBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal de Edição -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar Cliente <span id="editId"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3"><label class="form-label">Nome *</label><input id="editNome" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">Email *</label><input id="editEmail" type="email" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">Data de Nascimento *</label><input id="editData" type="date" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">CPF *</label><input id="editCpf" class="form-control" maxlength="11" required></div>
          <div class="mb-3"><label class="form-label">Endereço *</label><input id="editEndereco" class="form-control" required></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button id="btnSalvarEdit" class="btn btn-primary">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tbody = document.getElementById('clientesBody');
    const alertEl = document.getElementById('alertPlaceholder');
    let editModal, currentId;

    function showAlert(type, msg) {
      alertEl.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">${msg}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
    }

    async function carregarClientes() {
      try {
        const res = await fetch('/api/clientes');
        if (!res.ok) throw new Error(res.statusText);
        const lista = await res.json();
        tbody.innerHTML = '';
        if (lista.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center">Nenhum cliente cadastrado.</td></tr>`;
          return;
        }
        lista.forEach(c => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${c.id}</td><td>${c.nome}</td><td>${c.email}</td>
            <td>${new Date(c.dataNascimento).toLocaleDateString('pt-BR')}</td>
            <td>${c.cpf}</td><td>${c.endereco ?? '–'}</td>
            <td>
              <button class="btn btn-sm btn-warning btn-editar me-1" title="Editar"><i class="fa fa-pen"></i></button>
              <button class="btn btn-sm btn-danger btn-excluir" title="Excluir"><i class="fa fa-trash"></i></button>
            </td>`;
          tr.querySelector('.btn-editar').onclick = () => abrirEdicao(c);
          tr.querySelector('.btn-excluir').onclick = () => excluirCliente(c.id, c.nome);
          tbody.append(tr);
        });
      } catch (err) {
        showAlert('danger', 'Erro ao carregar clientes: ' + err);
      }
    }

    function abrirEdicao(c) {
      currentId = c.id;
      document.getElementById('editId').textContent = `#${c.id}`;
      document.getElementById('editNome').value = c.nome;
      document.getElementById('editEmail').value = c.email;
      document.getElementById('editData').value = c.dataNascimento.substring(0, 10);
      document.getElementById('editCpf').value = c.cpf;
      document.getElementById('editEndereco').value = c.endereco ?? '';
      editModal.show();
    }

    document.getElementById('btnSalvarEdit').onclick = async () => {
      const payload = {
        nome:           document.getElementById('editNome').value.trim(),
        email:          document.getElementById('editEmail').value.trim(),
        dataNascimento: document.getElementById('editData').value,
        cpf:            document.getElementById('editCpf').value.trim(),
        endereco:       document.getElementById('editEndereco').value.trim(),
      };
      try {
        const res = await fetch(`/api/clientes/${currentId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) { return showAlert('danger', 'Erro ao salvar: ' + await res.text()); }
        editModal.hide();
        showAlert('success', 'Cliente atualizado com sucesso.');
        await carregarClientes();
      } catch (err) {
        showAlert('danger', 'Erro de conexão: ' + err);
      }
    };

    async function excluirCliente(id, nome) {
      if (!confirm(`Deseja realmente excluir o cliente "${nome}" (ID ${id})?`)) return;
      try {
        const res = await fetch(`/api/clientes/${id}`, { method: 'DELETE' });
        if (res.status === 404) { showAlert('warning', 'Cliente não encontrado.'); return; }
        if (!res.ok) throw new Error(res.statusText);
        showAlert('success', `Cliente "${nome}" excluído com sucesso.`);
        await carregarClientes();
      } catch (err) {
        showAlert('danger', 'Erro ao excluir cliente: ' + err);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      editModal = new bootstrap.Modal(document.getElementById('editModal'));
      carregarClientes();
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
